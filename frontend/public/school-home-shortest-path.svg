<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="752" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>

  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">MAP ROUTE PROBLEM</text>
  <text x="600" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#334155">Find the shortest path from SCHOOL (START) to HOME (DESTINATION)</text>
  <text x="600" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#475569">Road weights are distances in kilometers. Minimize the total distance.</text>

  <g stroke="#64748b" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M250 365 L600 280"/>
    <path d="M600 280 L950 365"/>
    <path d="M250 365 L600 530"/>
    <path d="M600 530 L950 365"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="374" y="282" width="150" height="54" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="449" y="319">4 km</text>
    <rect x="677" y="282" width="150" height="54" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="752" y="319">3 km</text>
    <rect x="374" y="442" width="150" height="54" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="449" y="479">2 km</text>
    <rect x="677" y="442" width="150" height="54" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="752" y="479">6 km</text>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="250" cy="365" r="72" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
    <text x="250" y="357" font-size="27" font-weight="700" fill="#1e3a8a">SCHOOL</text>
    <text x="250" y="393" font-size="22" font-weight="700" fill="#1e40af">START</text>

    <circle cx="600" cy="280" r="66" fill="#dcfce7" stroke="#16a34a" stroke-width="6"/>
    <text x="600" y="289" font-size="28" font-weight="700" fill="#14532d">PARK</text>

    <circle cx="600" cy="530" r="66" fill="#fef3c7" stroke="#d97706" stroke-width="6"/>
    <text x="600" y="539" font-size="28" font-weight="700" fill="#78350f">BANK</text>

    <circle cx="950" cy="365" r="72" fill="#fce7f3" stroke="#db2777" stroke-width="6"/>
    <text x="950" y="357" font-size="27" font-weight="700" fill="#831843">HOME</text>
    <text x="950" y="393" font-size="22" font-weight="700" fill="#9d174d">DESTINATION</text>
  </g>

  <rect x="110" y="650" width="980" height="82" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Weighted graph: places are nodes; roads are edges with non-negative distances.</text>
  <text x="600" y="719" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e40af">Compare routes: School → Park → Home = 7 km; School → Bank → Home = 8 km.</text>
</svg>
